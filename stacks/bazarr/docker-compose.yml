services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Nicosia
    volumes:
      - ./config:/config
      - /mnt/data_1tb/media:/media
    ports:
      - 6767:6767
    networks:
      - arrnet
    restart: unless-stopped

networks:
  arrnet:
    external: true
